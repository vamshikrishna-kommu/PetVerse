version: '3.8'

# Development overlay for local debugging
services:
  mongodb:
    ports:
      - '27017:27017'

  redis:
    ports:
      - '6379:6379'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - NODE_ENV=development
    volumes:
      - ./apps/api/src:/app/apps/api/src:ro

  web:
    ports:
      - '5173:80'
